name: Deploy a AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag (SHA) ya publicado para rollback. Vacío = construir el commit actual."
        required: false
        default: ""

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build y push a GHCR
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Calcular nombres de imagen
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/cueva-api:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/cueva-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/cueva-web:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/cueva-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Desplegar en EC2
    needs: build-push
    # corre tras build-push, o solo (rollback) si se pasó image_tag
    if: ${{ always() && (needs.build-push.result == 'success' || inputs.image_tag) }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        name: Variables
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          BUILT_TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          echo "tag=${INPUT_TAG:-$BUILT_TAG}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Configurar SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copiar docker-compose al servidor
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml \
            "$EC2_USER@$EC2_HOST:/opt/cueva/docker-compose.yml"

      - name: Pull y up
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          OWNER: ${{ steps.vars.outputs.owner }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" bash -s <<EOF
          set -euo pipefail
          cd /opt/cueva
          umask 077
          cat > .env <<ENV
          REGISTRY=ghcr.io/${OWNER}
          IMAGE_TAG=${TAG}
          APP_VERSION=${TAG}
          WEATHERAPI_KEY=${WEATHERAPI_KEY}
          ENV
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          docker compose pull
          docker compose up -d --remove-orphans
          docker logout ghcr.io
          docker image prune -af --filter "until=168h"
          docker compose ps
          EOF

  smoke:
    name: Smoke test
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verificar servicio desplegado
        env:
          HOST: ${{ vars.EC2_HOST }}
          EXPECTED: ${{ needs.deploy.outputs.tag }}
        run: |
          for i in $(seq 1 10); do
            v=$(curl -fsS "http://$HOST/api/v1/health" | jq -r .version) && [ "$v" = "$EXPECTED" ] && break
            echo "intento $i: version='$v' esperado='$EXPECTED'"; sleep 6
          done
          [ "$v" = "$EXPECTED" ] || { echo "::error::La versión desplegada no coincide"; exit 1; }
          curl -fsS -o /dev/null -w "predicciones HTTP %{http_code}\n" "http://$HOST/api/v1/predicciones"
          curl -fsS -o /dev/null -w "web HTTP %{http_code}\n" "http://$HOST/"
