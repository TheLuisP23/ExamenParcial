# Se copia a /opt/cueva/docker-compose.yml en la EC2 (ver deploy.yml).
# Las variables salen de /opt/cueva/.env, que escribe el pipeline.
services:
  api:
    image: ${REGISTRY}/cueva-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      WEATHERAPI_KEY: ${WEATHERAPI_KEY}
      APP_VERSION: ${APP_VERSION}
      DATABASE_PATH: /data/cueva.db
      WEATHER_CACHE_TTL_SECONDS: "1800"
      TZ: America/Lima
    volumes:
      - cueva-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    expose:
      - "8000"

  web:
    image: ${REGISTRY}/cueva-web:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  cueva-data:
